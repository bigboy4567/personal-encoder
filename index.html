<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Encoder</title>
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="Encode un message ou un fichier en signal audio chiffré nécessitant ce logiciel pour être décodé.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131826;
    --panel-border: #232a3d;
    --text: #e6e9f0;
    --muted: #8791a8;
    --accent: #5fd3a6;
    --accent-dark: #3ba883;
    --danger: #e2685f;
    --input-bg: #0e1220;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main { width: 100%; max-width: 620px; }
  h1 { font-size: 1.5rem; margin-bottom: 0.2em; }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 28px; font-size: 0.92rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    flex: 1;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .tab-btn.active { color: var(--accent); border-color: var(--accent-dark); }
  .panel { display: none; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 24px; }
  .panel.active { display: block; }
  label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--muted); }
  textarea, input[type="text"], input[type="password"], input[type="file"] {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 10px;
    font-size: 0.95rem;
    margin-bottom: 16px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
  button[type="submit"], .record-btn {
    background: var(--accent);
    color: #06251a;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button[type="submit"]:hover, .record-btn:hover { background: var(--accent-dark); color: var(--text); }
  .status { margin-top: 12px; color: var(--muted); font-size: 0.88rem; min-height: 1.2em; }
  .result { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--panel-border); }
  .result[hidden] { display: none; }
  audio { width: 100%; margin-bottom: 10px; }
  .download-link {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent-dark);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.88rem;
  }
  .download-link:hover { background: var(--accent-dark); color: var(--text); }
  .duration { color: var(--muted); font-size: 0.82rem; margin-top: 8px; }
  .decoded-text {
    background: var(--input-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .divider { border: none; border-top: 1px solid var(--panel-border); margin: 24px 0; }
  .mode-toggle { display: flex; gap: 16px; margin-bottom: 18px; font-size: 0.9rem; }
  .mode-toggle label { display: flex; align-items: center; gap: 6px; color: var(--text); margin-bottom: 0; cursor: pointer; }
  .mode-toggle input[type="radio"] { accent-color: var(--accent); cursor: pointer; }
  .file-info { color: var(--muted); font-size: 0.8rem; margin-top: -10px; margin-bottom: 16px; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--input-bg);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-bar[hidden] { display: none; }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.2s ease;
  }
  #decode-file-preview {
    display: block;
    max-width: 100%;
    max-height: 320px;
    border-radius: 8px;
    margin-bottom: 14px;
    border: 1px solid var(--panel-border);
  }
  #decode-file-preview[hidden] { display: none; }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: -8px; margin-bottom: 16px; }
  .error-text { color: var(--danger); }
  .inline-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 0.85rem; }
  .passgen-result {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--input-bg);
    border: 1px solid var(--accent-dark);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-family: "Consolas", monospace;
    font-size: 0.9rem;
  }
  .passgen-result[hidden] { display: none; }
  .copy-btn {
    background: var(--accent);
    color: #06251a;
    border: none;
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .copy-btn:hover { background: var(--accent-dark); color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Personal Encoder</h1>

  <div class="tabs">
    <button class="tab-btn active" data-target="tab-encode">Encoder</button>
    <button class="tab-btn" data-target="tab-decode">Décoder</button>
  </div>

  <section id="tab-encode" class="panel active">
    <div class="mode-toggle">
      <label><input type="radio" name="encode-mode" value="text" checked> Texte</label>
      <label><input type="radio" name="encode-mode" value="file"> Fichier (max 50 Mo)</label>
    </div>
    <form id="encode-form">
      <div id="encode-text-fields">
        <label for="encode-message">Message à encoder</label>
        <textarea id="encode-message"></textarea>
      </div>
      <div id="encode-file-fields" hidden>
        <label for="encode-file-input">Fichier à encoder (max 50 Mo)</label>
        <input type="file" id="encode-file-input">
        <p id="encode-file-info" class="file-info"></p>
      </div>

      <button type="submit">Encoder en audio</button>
    </form>
    <div id="encode-status" class="status"></div>
    <div id="encode-progress" class="progress-bar" hidden><div id="encode-progress-fill" class="progress-fill"></div></div>
    <div id="encode-result" class="result" hidden>
      <label class="inline-label">Passphrase générée — note-la et transmets-la au destinataire par un autre canal</label>
      <div id="passgen-result" class="passgen-result">
        <span id="passgen-value"></span>
        <button type="button" id="passgen-copy" class="copy-btn">Copier</button>
      </div>
      <audio id="encode-audio" controls></audio>
      <a id="encode-download" class="download-link" href="#">Télécharger le .wav</a>
      <div id="encode-duration" class="duration"></div>
    </div>
  </section>

  <section id="tab-decode" class="panel">
    <form id="decode-form">
      <label for="decode-file">Fichier audio (.wav, ou tout format que ton navigateur sait lire)</label>
      <input type="file" id="decode-file" accept="audio/*" required>

      <label for="decode-key">Passphrase</label>
      <input type="password" id="decode-key" required autocomplete="off">

      <button type="submit">Décoder</button>
    </form>
    <div id="decode-status" class="status"></div>
    <div id="decode-progress" class="progress-bar" hidden><div id="decode-progress-fill" class="progress-fill"></div></div>
    <div id="decode-result" class="result decoded-text" hidden></div>
    <div id="decode-file-result" class="result" hidden>
      <img id="decode-file-preview" hidden alt="Aperçu de l'image décodée">
      <p>Fichier décodé : <strong id="decode-file-name"></strong></p>
      <a id="decode-file-download" class="download-link" href="#">Télécharger le fichier</a>
    </div>

    <hr class="divider" id="mic-divider">

    <div id="mic-section">
      <label for="decode-key-mic">Passphrase (pour l'enregistrement micro — mode texte uniquement)</label>
      <input type="password" id="decode-key-mic" autocomplete="off">
      <p class="hint">Joue le son (haut-parleur) pendant l'enregistrement, puis arrête pour décoder.</p>
      <button type="button" id="record-btn" class="record-btn">Enregistrer depuis le micro</button>
      <div id="record-status" class="status"></div>
      <div id="decode-result-mic" class="result decoded-text" hidden></div>
    </div>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
